[project]
name = "content-ideation"
version = "0.1.0"
description = "Find video topics that are repeatable on YouTube and rising in Google search."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.7.0",
    "google-ads>=32.0.0",
    "google-auth-oauthlib>=1.4.1",
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
